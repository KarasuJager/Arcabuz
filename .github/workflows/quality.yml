name: Quality
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,gui,gui-test]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pip check
      - run: fuzzrank --help
      - run: fuzzrank doctor
      - run: fuzzrank analyze tests/fixtures --target https://fixture.example --output results/ci-import --quiet
      - run: fuzzrank watch tests/fixtures --target https://fixture.example --max-updates 1 --output results/ci-watch --quiet
      - run: fuzzrank demo --output results/ci-demo --quiet
      - run: python -m build
      - run: python scripts/wheel_smoke.py --wheel-dir dist --output results/ci-wheel --gui
