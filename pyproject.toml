[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzrank"
version = "2.0.0"
description = "Deterministic, offline triage of authorized web discovery results"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = ["rich>=13.7,<15", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2", "jsonschema>=4.23,<5"]
gui = ["PySide6-Essentials>=6.8,<7", "jsonschema>=4.23,<5"]
gui-test = ["pytest-qt>=4.4,<5"]

[project.scripts]
fuzzrank = "fuzzrank.cli:main"

[project.gui-scripts]
fuzzrank-gui = "fuzzrank.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuzzrank = ["profiles/*.yaml", "rules/*.yaml", "schemas/*.json", "gui/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
